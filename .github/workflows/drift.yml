name: drift

on:
  schedule:
    # Mondays 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AgentMail API drift
        id: check
        run: |
          python3 scripts/drift_check.py | tee drift-report.md
          if python3 scripts/drift_check.py --check >/dev/null 2>&1; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update drift issue
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list \
            --search "AgentMail API drift in:title" --state open \
            --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file drift-report.md
          else
            gh issue create \
              --title "AgentMail API drift detected" \
              --body-file drift-report.md
          fi

      - name: Close resolved drift issue
        if: steps.check.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list \
            --search "AgentMail API drift in:title" --state open \
            --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment \
              "No drift against the current spec. Re-pin scripts/upstream_pin.json to the commit you built against."
          fi
